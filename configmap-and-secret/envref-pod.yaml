apiVersion: v1
kind: Pod
metadata:
  name: pod-envref
spec:
  containers:
    - name: app
      image: myapp:latest
      env:
        # From ConfigMap
        - name: ENVIRONMENT          # custom env var name
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: APP_ENV           # key inside the ConfigMap

        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: LOG_LEVEL
              optional: true         # pod still starts if key is missing

        # From Secret
        - name: DATABASE_PASSWORD    # custom env var name
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: DB_PASSWORD

        - name: EXTERNAL_API_KEY
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: API_KEY