apiVersion: v1
kind: Pod
metadata:
  name: pod-vol-data-as-files
spec:
  volumes:
    - name: config-vol
      configMap:
        name: app-config
        defaultMode: 0644            # file permissions

  containers:
    - name: app
      image: myapp:latest
      volumeMounts:
        - name: config-vol
          mountPath: /etc/config     # all keys mounted here as files

# Result inside the container:
# /etc/config/APP_ENV          → "production"
# /etc/config/LOG_LEVEL        → "info"
# /etc/config/MAX_CONNECTIONS  → "100"
# /etc/config/app.conf         → multiline server config
# /etc/config/nginx.conf       → multiline nginx config